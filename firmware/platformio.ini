[platformio]
default_envs = esp32-s3-n16r8
src_dir = src

[env:esp32-s3-n16r8]
platform = platformio/espressif32 @ ~8.0.0
board = esp32-s3-devkitc-1
framework = arduino

build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
lib_deps =
    links2004/WebSockets @ 2.7.2
    FS
    LittleFS
lib_ldf_mode = deep
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
check_skip_packages = yes

[env:esp32-s3-n16r8-factory]
extends = env:esp32-s3-n16r8
extra_scripts = post:scripts/factory_nvs.py
custom_nvs_csv = nvs.csv
